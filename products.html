<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Програми — HQ Штаб-квартира</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>

:root {
  --bg-primary: #FFFFFF;
  --bg-secondary: #FAFAFA;
  --bg-tertiary: #F0F0F0;
  --text-primary: #262626;
  --text-secondary: #8E8E8E;
  --accent: #0095F6;
  --accent-hover: #1877F2;
  --border: #DBDBDB;
  --shadow: rgba(0, 0, 0, 0.1);
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { background:var(--bg-primary); color:var(--text-primary); font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow-x:hidden; }

nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:1rem 4rem; backdrop-filter:blur(20px); background:rgba(255,255,255,0.95); border-bottom:1px solid var(--border); }
.nav-logo { display:flex; align-items:center; }
.nav-logo img { height:38px; width:auto; }
.nav-links { display:flex; gap:2rem; list-style:none; align-items:center; }
.nav-links a { color:var(--text-primary); text-decoration:none; font-size:0.9rem; font-weight:400; transition:color 0.2s; }
.nav-links a:hover { color:var(--accent); }
.nav-links .btn-nav { background:var(--accent); color:#FFFFFF; padding:0.5rem 1rem; border-radius:8px; font-weight:500; }
.nav-links .btn-nav:hover { background:var(--accent-hover); color:#FFFFFF; }
@media(max-width:900px){ nav{padding:1rem 1.5rem;} .nav-links{display:none;} }

.btn-primary { background:var(--accent); color:#FFFFFF; padding:0.7rem 1.5rem; border:none; cursor:pointer; font-size:0.95rem; font-weight:500; border-radius:8px; text-decoration:none; transition:background 0.2s; display:inline-block; }
.btn-primary:hover { background:var(--accent-hover); }
.btn-outline { background:transparent; color:var(--text-primary); padding:0.7rem 1.5rem; border:1px solid var(--border); cursor:pointer; font-size:0.95rem; font-weight:500; border-radius:8px; text-decoration:none; transition:border-color 0.2s; display:inline-block; }
.btn-outline:hover { border-color:var(--text-primary); }
.section-label { font-size:0.75rem; font-weight:600; text-transform:uppercase; color:var(--text-secondary); margin-bottom:1rem; display:flex; align-items:center; gap:0.8rem; }
.section-label::before { content:''; width:20px; height:2px; background:var(--accent); border-radius:2px; }
.section-title { font-size:clamp(1.8rem,3.5vw,2.8rem); font-weight:700; line-height:1.2; margin-bottom:1rem; }
.section-text { font-size:1rem; line-height:1.7; color:var(--text-secondary); max-width:600px; }
section { padding:5rem 4rem; }
@media(max-width:900px){ section{padding:3rem 1.5rem;} }
.reveal { opacity:0; transform:translateY(20px); transition:opacity 0.5s ease,transform 0.5s ease; }
.reveal.visible { opacity:1; transform:translateY(0); }

footer { background:var(--bg-secondary); border-top:1px solid var(--border); padding:4rem 4rem 2rem; }
.footer-top { display:grid; grid-template-columns:280px 1fr; gap:4rem; margin-bottom:3rem; }
.footer-links { display:grid; grid-template-columns:repeat(4,1fr); gap:2rem; }
.footer-col { display:flex; flex-direction:column; gap:0.6rem; }
.footer-col-title { font-size:0.75rem; font-weight:600; text-transform:uppercase; color:var(--text-secondary); margin-bottom:0.4rem; }
.footer-col a { color:var(--text-primary); text-decoration:none; font-size:0.9rem; transition:color 0.2s; }
.footer-col a:hover { color:var(--accent); }
.footer-bottom { border-top:1px solid var(--border); padding-top:2rem; display:flex; justify-content:space-between; font-size:0.85rem; color:var(--text-secondary); }
@media(max-width:900px){ .footer-top{grid-template-columns:1fr;} .footer-links{grid-template-columns:repeat(2,1fr);} footer{padding:3rem 1.5rem 2rem;} .footer-bottom{flex-direction:column;gap:0.5rem;} }
</head>
