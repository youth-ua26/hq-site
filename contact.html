<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HQ - Контакти | Зв'яжіться з нами</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="container">
        <div class="logo"><a href="index.html">HQ<span>.</span></a></div>
        <nav>
            <ul>
                <li><a href="index.html">Головна</a></li>
                <li><a href="team.html">Команда</a></li>
                <li><a href="projects.html">Проєкти</a></li>
                <li><a href="products.html">Продукція</a></li>
                <li><a href="contact.html">Контакти</a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="container">
    <h1 class="section-title">Напишіть нам</h1>

    <form class="contact-form">
        <div class="form-group">
            <label for="name">Ваше ім'я</label>
            <input type="text" id="name" name="name" required placeholder="Іван Іванов">
        </div>
        <div class="form-group">
            <label for="email">Ваш Email</label>
            <input type="email" id="email" name="email" required placeholder="example@email.com">
        </div>
        <div class="form-group">
            <label for="message">Повідомлення</label>
            <textarea id="message" name="message" required placeholder="Ваше повідомлення..."></textarea>
        </div>
        <button type="submit" class="btn">Відправити</button>
    </form>
</main>

<footer>
    <div class="container">
        <p>&copy; 2024 HQ Inc. Всі права захищені.</p>
        <div class="footer-links">
            <ul>
                <li><a href="index.html">Головна</a></li>
                <li><a href="contact.html">Контакти</a></li>
            </ul>
        </div>
    </div>
</footer>

</body>
</html>
